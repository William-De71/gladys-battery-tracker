<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="1000" height="340" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="60" width="230" height="190" rx="14" fill="#fff7e6" stroke="#bf8700" stroke-width="2"/>
    <text x="135" y="98" font-size="18" font-weight="bold" fill="#1f2328">Your sensors</text>
    <text x="135" y="126" font-size="14" fill="#57606a">Zigbee, Z-Wave, MQTT…</text>
    <text x="135" y="146" font-size="14" fill="#57606a">(other integrations)</text>
    <text x="135" y="176" font-size="14" fill="#57606a">and what no sensor</text>
    <text x="135" y="196" font-size="14" fill="#57606a">watches: remotes,</text>
    <text x="135" y="216" font-size="14" fill="#57606a">clocks, smoke detectors</text>
    <rect x="360" y="60" width="250" height="190" rx="14" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
    <text x="485" y="98" font-size="20" font-weight="bold" fill="#1f2328">Gladys Assistant</text>
    <text x="485" y="126" font-size="14" fill="#57606a">configuration buttons,</text>
    <text x="485" y="146" font-size="14" fill="#57606a">one device per battery,</text>
    <text x="485" y="166" font-size="14" fill="#57606a">scenes, widgets,</text>
    <text x="485" y="186" font-size="14" fill="#57606a">native low battery warning</text>
    <text x="485" y="216" font-size="13" fill="#57606a">records kept in its database</text>
    <rect x="720" y="60" width="260" height="190" rx="14" fill="#eef8f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="850" y="98" font-size="16" font-weight="bold" fill="#1f2328">gladys-battery-tracker</text>
    <text x="850" y="126" font-size="14" fill="#57606a">Docker container</text>
    <text x="850" y="146" font-size="14" fill="#57606a">life, level, urgency,</text>
    <text x="850" y="166" font-size="14" fill="#57606a">stock, shopping list</text>
    <text x="850" y="186" font-size="14" fill="#57606a">device library (Battery Notes)</text>
    <text x="850" y="216" font-size="13" fill="#57606a">/data: last reported levels</text>
    <path d="M255 155 H355" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="305" y="138" font-size="12" fill="#57606a">battery level</text>
    <text x="305" y="178" font-size="12" fill="#57606a">(a scene reads it)</text>
    <path d="M615 155 H715" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="665" y="138" font-size="12" fill="#57606a">REST</text>
    <text x="665" y="178" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="665" y="275" font-size="12" fill="#57606a">/api/integration/v1/*</text>
    <text x="500" y="320" font-size="13" fill="#57606a">Local transport: no online service is called, nothing leaves the house. Illustration.</text>
  </g>
</svg>
